name: Update easy rules

on:
  schedule:
    # 每天 01:30 UTC（北京时间 09:30）。EasyList 通常在 UTC 00:10 前后更新
    - cron: "30 1 * * *"
  workflow_dispatch:   # 支持在 Actions 页面手动触发

permissions:
  contents: write      # 允许提交 rules/ 下的生成文件

concurrency:
  group: update-easy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build rules
        run: python scripts/build_easy.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/easy.json rules/easy.list
          if git diff --cached --quiet; then
            echo "规则无变化，跳过提交"
          else
            git commit -m "chore: update rules $(date -u +%Y-%m-%d)"
            git push
          fi
